<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>辅食计划 - 宝宝辅食助手</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-btn">← 返回首页</a>
    
    <h2 style="margin-bottom: 16px;">📝 辅食计划</h2>
    
    <!-- 日期选择 -->
    <div class="form-group">
      <label>选择日期</label>
      <input type="date" class="form-control" id="planDate" onchange="loadPlan()">
    </div>
    
    <!-- 添加食材 -->
    <div class="form-group">
      <label>添加食材</label>
      <div style="display: flex; gap: 8px;">
        <input type="text" class="form-control" id="foodInput" placeholder="输入食材名称" onkeypress="if(event.key==='Enter') addFood()">
        <button class="btn btn-primary" style="white-space: nowrap;" onclick="addFood()">添加</button>
      </div>
    </div>
    
    <!-- 已添加食材 -->
    <div id="addedFoods" style="margin-bottom: 16px;"></div>
    
    <!-- 推荐食材按钮 -->
    <button class="btn btn-orange btn-block" style="margin-bottom: 16px;" onclick="showRecommendedFoods()">
      🎯 推荐适合当前年龄的食材
    </button>
    
    <!-- 推荐食材区域 -->
    <div id="recommendedArea" style="display: none; margin-bottom: 16px;">
      <div style="font-weight: bold; margin-bottom: 8px;">推荐食材（已排除已尝试的）：</div>
      <div id="recommendedFoods"></div>
    </div>
    
    <!-- 检测按钮 -->
    <button class="btn btn-green btn-block" style="margin-bottom: 16px;" onclick="checkFoods()">
      🔍 检测相生相克
    </button>
    
    <!-- 检测结果 -->
    <div id="checkResult"></div>
    
    <!-- 保存按钮 -->
    <button class="btn btn-blue btn-block" onclick="savePlan()">💾 保存计划</button>
    
    <!-- 历史记录 -->
    <div style="margin-top: 30px;">
      <h3 style="margin-bottom: 12px;">历史记录</h3>
      <div id="historyList"></div>
    </div>
  </div>
  
  <script src="js/app.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/meal-planner.js"></script>
</body>
</html>
