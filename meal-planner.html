<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>辅食计划 - 宝宝辅食助手</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <header class="subpage-header">
      <a href="index.html" class="back-btn">← 返回首页</a>
      <h1 class="page-title">📝 辅食计划</h1>
    </header>
    
    <main class="container">
      <section class="card-section">
        <div class="form-group">
          <label for="planDate">选择日期</label>
          <input type="date" class="form-control" id="planDate" onchange="loadPlan()">
        </div>
        
        <div class="form-group">
          <label for="foodInput">添加食材</label>
          <div class="input-group">
            <input type="text" class="form-control" id="foodInput" placeholder="输入食材名称" onkeypress="if(event.key==='Enter') addFood()">
            <button class="btn btn-primary" onclick="addFood()">添加</button>
          </div>
        </div>
      </section>
      
      <section class="card-section">
        <h3 class="section-title">已添加食材</h3>
        <div id="addedFoods" class="food-tags"></div>
      </section>
      
      <section class="card-section">
        <button class="btn btn-warning btn-block" onclick="showRecommendedFoods()">
          🎯 推荐适合当前年龄的食材
        </button>
      </section>
      
      <section id="recommendedArea" class="card-section" style="display: none;">
        <h3 class="section-title">推荐食材（已排除已尝试的）</h3>
        <div id="recommendedFoods" class="food-grid"></div>
      </section>
      
      <section class="card-section">
        <button class="btn btn-success btn-block" onclick="checkFoods()">
          🔍 检测相生相克
        </button>
      </section>
      
      <section class="card-section">
        <div id="checkResult"></div>
      </section>
      
      <section class="card-section">
        <button class="btn btn-info btn-block" onclick="savePlan()">💾 保存计划</button>
      </section>
      
      <section class="card-section">
        <h3 class="section-title">历史记录</h3>
        <div id="historyList" class="history-list"></div>
      </section>
    </main>
  </div>
  
  <script src="js/app.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/meal-planner.js"></script>
</body>
</html>
