<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>成长记录 - 宝宝辅食助手</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <header class="page-header">
      <a href="index.html" class="back-btn">← 返回首页</a>
      <h2 class="page-title">📈 成长记录</h2>
    </header>
    
    <main class="container">
      <div class="alert alert-info" id="ageInfo">当前年龄加载中...</div>
      
      <section class="section-card">
        <h3 class="section-title">添加新记录</h3>
        <form class="form-section" onsubmit="addRecord(); return false;">
          <div class="form-group">
            <label class="form-label">日期</label>
            <input type="date" class="form-control" id="recordDate">
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">身高 (cm)</label>
              <input type="number" class="form-control" id="height" placeholder="如：75.5" step="0.1">
            </div>
            <div class="form-group">
              <label class="form-label">体重 (kg)</label>
              <input type="number" class="form-control" id="weight" placeholder="如：9.5" step="0.1">
            </div>
          </div>
          
          <div class="form-group">
            <label class="form-label">头围 (cm，可选)</label>
            <input type="number" class="form-control" id="headCircumference" placeholder="如：45.0" step="0.1">
          </div>
          
          <button type="submit" class="btn btn-primary btn-block">💾 保存记录</button>
        </form>
      </section>
      
      <section class="section-card">
        <h3 class="section-title">历史记录</h3>
        <div id="recordList"></div>
      </section>
    </main>
  </div>
  
  <script src="js/app.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/growth.js"></script>
</body>
</html>
