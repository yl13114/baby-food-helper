<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>宝宝辅食助手</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-content">
        <h1 class="header-title">
          <span class="emoji">🍎</span>
          宝宝辅食助手
        </h1>
        <div class="age-display" id="ageDisplay">计算中...</div>
        <div class="date-display" id="dateDisplay"></div>
      </div>
    </header>
    
    <main class="container">
      <nav class="card-grid">
        <a href="meal-planner.html" class="card card-meal">
          <div class="card-icon-wrapper">
            <span class="card-icon">📝</span>
          </div>
          <div class="card-content">
            <h3 class="card-title">辅食计划</h3>
            <p class="card-desc">每日食材安排与相克检测</p>
          </div>
          <span class="card-arrow">›</span>
        </a>
        
        <a href="food-encyclopedia.html" class="card card-encyclopedia">
          <div class="card-icon-wrapper">
            <span class="card-icon">📚</span>
          </div>
          <div class="card-content">
            <h3 class="card-title">食材百科</h3>
            <p class="card-desc">营养价值与相生相克查询</p>
          </div>
          <span class="card-arrow">›</span>
        </a>
        
        <a href="feeding-schedule.html" class="card card-schedule">
          <div class="card-icon-wrapper">
            <span class="card-icon">📅</span>
          </div>
          <div class="card-content">
            <h3 class="card-title">辅食时间表</h3>
            <p class="card-desc">按月龄查看推荐辅食</p>
          </div>
          <span class="card-arrow">›</span>
        </a>
        
        <a href="growth-tracker.html" class="card card-growth">
          <div class="card-icon-wrapper">
            <span class="card-icon">📈</span>
          </div>
          <div class="card-content">
            <h3 class="card-title">成长记录</h3>
            <p class="card-desc">记录宝宝发育数据</p>
          </div>
          <span class="card-arrow">›</span>
        </a>
        
        <a href="allergy-tracker.html" class="card card-allergy">
          <div class="card-icon-wrapper">
            <span class="card-icon">✅</span>
          </div>
          <div class="card-content">
            <h3 class="card-title">排敏进度</h3>
            <p class="card-desc">记录已尝试的食材状态</p>
          </div>
          <span class="card-arrow">›</span>
        </a>
      </nav>
    </main>
  </div>
  
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function (err) {
        console.log('SW registration failed:', err);
      });
    }
  </script>
</body>
</html>
