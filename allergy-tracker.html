<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>排敏进度 - 宝宝辅食助手</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <header class="page-header">
      <a href="index.html" class="back-btn">← 返回首页</a>
      <h2 class="page-title">🍎 排敏进度</h2>
    </header>
    
    <main class="container">
      <!-- 统计区域 -->
      <div class="stats-grid">
        <div class="stat-card stat-green">
          <div class="stat-number" id="organicCount">0</div>
          <div class="stat-label">🟢 有机已吃</div>
        </div>
        <div class="stat-card stat-blue">
          <div class="stat-number" id="normalCount">0</div>
          <div class="stat-label">🔵 普通已吃</div>
        </div>
        <div class="stat-card stat-gray">
          <div class="stat-number" id="noneCount">0</div>
          <div class="stat-label">⚪ 未吃过</div>
        </div>
        <div class="stat-card stat-orange">
          <div class="stat-number" id="plannedCount">0</div>
          <div class="stat-label">🟠 计划添加</div>
        </div>
      </div>
      
      <!-- 进度条 -->
      <div class="progress-section">
        <div class="progress-header">
          <span class="progress-label">已尝试食材</span>
          <span class="progress-label" id="progressText">0 / 0 种</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
      
      <!-- 食材列表区域 -->
      <div id="foodCategories"></div>
      
      <!-- 添加新食材按钮 -->
      <button class="btn btn-primary btn-block" onclick="showAddFoodModal()">
        <span class="btn-icon">+</span> 添加新食材
      </button>
    </main>
  </div>
  
  <!-- 帮助按钮 -->
  <button class="help-btn" onclick="toggleTooltip()">?</button>
  
  <!-- 提示弹出框 -->
  <div class="tooltip" id="tooltip">
    <div class="tooltip-header">🎨 颜色含义说明</div>
    <div class="tooltip-item">
      <div class="tooltip-color" style="background: var(--green);"></div>
      <span>🟢 绿色：有机已吃</span>
    </div>
    <div class="tooltip-item">
      <div class="tooltip-color" style="background: var(--blue);"></div>
      <span>🔵 蓝色：普通已吃</span>
    </div>
    <div class="tooltip-item">
      <div class="tooltip-color" style="background: var(--gray);"></div>
      <span>⚪ 灰色：未吃过</span>
    </div>
    <div class="tooltip-item">
      <div class="tooltip-color" style="background: var(--orange);"></div>
      <span>🟠 橙色：计划添加</span>
    </div>
    <div class="tooltip-tip">点击食材按钮可循环切换状态</div>
  </div>
  
  <!-- 添加食材模态框 -->
  <div class="modal" id="addFoodModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">添加新食材</h3>
        <button class="modal-close" onclick="closeAddFoodModal()">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">食材名称</label>
          <input type="text" class="form-control" id="newFoodName" placeholder="请输入食材名称">
        </div>
        <div class="form-group">
          <label class="form-label">分类</label>
          <select class="form-control" id="newFoodCategory">
            <option value="vegetables">蔬菜类</option>
            <option value="fruits">水果类</option>
            <option value="meats">肉类</option>
            <option value="grains">谷物类</option>
            <option value="dairy">蛋奶类</option>
            <option value="beans">豆类</option>
            <option value="nuts">坚果类</option>
          </select>
        </div>
      </div>
      <button class="btn btn-primary btn-block" onclick="addNewFood()">确认添加</button>
    </div>
  </div>
  
  <script src="js/app.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/allergy-tracker.js"></script>
</body>
</html>
