<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>排敏进度 - 宝宝辅食助手</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-btn">← 返回首页</a>
    
    <h2 style="margin-bottom: 16px;">🍎 排敏进度</h2>
    
    <!-- 统计区域 -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="number" style="color: var(--green);" id="organicCount">0</div>
        <div class="label">🟢 有机已吃</div>
      </div>
      <div class="stat-card">
        <div class="number" style="color: var(--blue);" id="normalCount">0</div>
        <div class="label">🔵 普通已吃</div>
      </div>
      <div class="stat-card">
        <div class="number" style="color: var(--gray);" id="noneCount">0</div>
        <div class="label">⚪ 未吃过</div>
      </div>
      <div class="stat-card">
        <div class="number" style="color: var(--orange);" id="plannedCount">0</div>
        <div class="label">🟠 计划添加</div>
      </div>
    </div>
    
    <!-- 进度条 -->
    <div style="margin-bottom: 20px;">
      <div style="display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px;">
        <span>已尝试</span>
        <span id="progressText">0 / 0 种食材</span>
      </div>
      <div class="progress-bar">
        <div class="fill" id="progressFill" style="width: 0%;"></div>
      </div>
    </div>
    
    <!-- 食材列表区域 -->
    <div id="foodCategories"></div>
    
    <!-- 添加新食材按钮 -->
    <button class="btn btn-primary btn-block" style="margin-top: 20px;" onclick="showAddFoodModal()">
      + 添加新食材
    </button>
  </div>
  
  <!-- 帮助按钮 -->
  <button class="help-btn" onclick="toggleTooltip()">?</button>
  
  <!-- 提示弹出框 -->
  <div class="tooltip" id="tooltip">
    <div style="font-weight: bold; margin-bottom: 12px;">颜色含义说明</div>
    <div class="tooltip-item">
      <div class="tooltip-color" style="background: var(--green);"></div>
      <span>🟢 绿色：有机已吃</span>
    </div>
    <div class="tooltip-item">
      <div class="tooltip-color" style="background: var(--blue);"></div>
      <span>🔵 蓝色：普通已吃</span>
    </div>
    <div class="tooltip-item">
      <div class="tooltip-color" style="background: var(--gray);"></div>
      <span>⚪ 灰色：未吃过</span>
    </div>
    <div class="tooltip-item">
      <div class="tooltip-color" style="background: var(--orange);"></div>
      <span>🟠 橙色：计划添加</span>
    </div>
    <div style="font-size: 12px; color: var(--text-light); margin-top: 12px;">
      点击食材按钮可循环切换状态
    </div>
  </div>
  
  <!-- 添加食材模态框 -->
  <div class="modal" id="addFoodModal">
    <div class="modal-content" style="width: 90%; max-width: 350px;">
      <div class="modal-header">
        <h3>添加新食材</h3>
        <button class="modal-close" onclick="closeAddFoodModal()">×</button>
      </div>
      <div class="form-group">
        <label>食材名称</label>
        <input type="text" class="form-control" id="newFoodName" placeholder="请输入食材名称">
      </div>
      <div class="form-group">
        <label>分类</label>
        <select class="form-control" id="newFoodCategory">
          <option value="vegetables">蔬菜类</option>
          <option value="fruits">水果类</option>
          <option value="meats">肉类</option>
          <option value="grains">谷物类</option>
          <option value="dairy">蛋奶类</option>
          <option value="beans">豆类</option>
          <option value="nuts">坚果类</option>
        </select>
      </div>
      <button class="btn btn-primary btn-block" onclick="addNewFood()">添加</button>
    </div>
  </div>
  
  <script src="js/app.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/allergy-tracker.js"></script>
</body>
</html>
